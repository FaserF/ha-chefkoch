refresh_recipe:
  name: Refresh Recipes
  description: Manually trigger a refresh of all Chefkoch recipes (useful for getting a new random recipe).
add_to_shopping_list:
  name: Add to Shopping List
  description: Adds all ingredients of a recipe to the Home Assistant shopping list.
  fields:
    entity_id:
      name: Entity
      description: The Chefkoch sensor to get ingredients from.
      required: true
      selector:
        entity:
          domain: sensor
    servings:
      name: Target Servings
      description: Optional target number of servings to dynamically scale ingredient quantities.
      required: false
      selector:
        number:
          min: 1
          max: 50
          mode: box
generate_meal_plan:
  name: Generate Meal Plan
  description: Generates a multi-day meal plan, fires a chefkoch_meal_plan_generated event and returns it (with ready-made message_markdown/html/plain, title = link, one recipe per line).
  fields:
    days:
      name: Number of Days
      description: Number of days to generate suggestions for (1 to 7).
      required: false
      default: 7
      selector:
        number:
          min: 1
          max: 7
          mode: slider
    recipe_type:
      name: Recipe type
      required: false
      default: search
      selector:
        select:
          options: [search, random, weather, vegan, vegetarian, baking, daily]
          translation_key: sensor_type
    query:
      name: Search term
      description: Free-text search (e.g. 'Pasta', 'Kürbissuppe'). Optional.
      required: false
      selector:
        text:
    meal_type:
      name: Meal type
      description: Restrict to a kind of dish. 'main' excludes desserts, baking, drinks and breakfast (ideal for planning dinner).
      required: false
      selector:
        select:
          options: [any, main, dessert, breakfast, soup, salad, snack, side, drink]
          translation_key: meal_type
    diets:
      name: Diets
      description: Required diets.
      required: false
      selector:
        select:
          multiple: true
          options: [vegan, vegetarian, low_carb, low_calorie, low_fat, gluten_free]
          translation_key: diet
    include_keywords:
      name: Must contain
      description: At least one of these words must appear in title, tags, category or ingredients.
      required: false
      selector:
        text:
          multiple: true
    exclude_keywords:
      name: Must not contain
      description: Recipes with any of these words in title, tags or category are skipped (e.g. Kuchen, Torte).
      required: false
      selector:
        text:
          multiple: true
    exclude_ingredients:
      name: Excluded ingredients
      description: Recipes containing any of these ingredients are skipped.
      required: false
      selector:
        text:
          multiple: true
    categories:
      name: Categories / cuisines
      description: At least one must match the recipe's category or cuisine (e.g. Italien, Suppen).
      required: false
      selector:
        text:
          multiple: true
    exclude_categories:
      name: Excluded categories
      description: Recipes in any of these categories are skipped.
      required: false
      selector:
        text:
          multiple: true
    max_total_minutes:
      name: Max. total time
      description: Maximum total preparation time in minutes.
      required: false
      selector:
        number:
          min: 5
          max: 600
          step: 5
          unit_of_measurement: min
          mode: box
    min_rating:
      name: Min. rating
      description: Minimum average rating (1-5).
      required: false
      selector:
        number:
          min: 1
          max: 5
          step: 0.5
          mode: box
    max_difficulty:
      name: Max. difficulty
      required: false
      selector:
        select:
          options: [einfach, normal, pfiffig]
          translation_key: difficulty
    max_calories:
      name: Max. calories
      description: Maximum kcal per serving.
      required: false
      selector:
        number:
          min: 50
          max: 3000
          step: 50
          unit_of_measurement: kcal
          mode: box
    sort:
      name: Sort order
      required: false
      selector:
        select:
          options: [relevance, rating, newest]
          translation_key: sort
    providers:
      name: Recipe sources
      description: Providers to query in this order (chefkoch, themealdb, spoonacular). Empty = integration settings.
      required: false
      selector:
        select:
          multiple: true
          options: [chefkoch, themealdb, spoonacular]
          translation_key: provider
    header:
      name: Message header
      description: Text placed above the recipe list in message_markdown / message_html / message_plain (write it in the target format, e.g. <b>..</b> for Telegram HTML).
      required: false
      selector:
        text:
          multiline: true
    footer:
      name: Message footer
      description: Text placed below the recipe list.
      required: false
      selector:
        text:
          multiline: true
    numbering:
      name: Numbering style
      required: false
      default: emoji
      selector:
        select:
          options: [emoji, number, bullet, none]
          translation_key: numbering
    details:
      name: Details per recipe
      description: Facts appended to each line in brackets.
      required: false
      default: [category]
      selector:
        select:
          multiple: true
          options: [category, time, rating, calories, difficulty, provider]
          translation_key: detail
