refresh_recipe:
  name: Refresh Recipes
  description: Manually trigger a refresh of all Chefkoch recipes (useful for getting a new random recipe).
add_to_shopping_list:
  name: Add to Shopping List
  description: Adds all ingredients of a recipe to the Home Assistant shopping list.
  fields:
    entity_id:
      name: Entity
      description: The Chefkoch sensor to get ingredients from.
      required: true
      selector:
        entity:
          domain: sensor
    servings:
      name: Target Servings
      description: Optional target number of servings to dynamically scale ingredient quantities.
      required: false
      selector:
        number:
          min: 1
          max: 50
          mode: box
generate_meal_plan:
  name: Generate Meal Plan
  description: Generates a multi-day meal plan with recipe suggestions and fires a chefkoch_meal_plan_generated event.
  fields:
    days:
      name: Number of Days
      description: Number of days to generate suggestions for (1 to 7).
      required: false
      default: 7
      selector:
        number:
          min: 1
          max: 7
          mode: slider
    query:
      name: Search Query
      description: Optional search term or diet preference (e.g., 'Schnell', 'Vegetarisch', 'Pasta').
      required: false
      selector:
        text:
get_recipe:
  name: Get Recipe
  description: Fetches a single fresh recipe from Chefkoch directly without reloading the integration, returning all recipe data in the response.
  fields:
    recipe_type:
      name: Recipe Type
      description: Type or category of recipe (e.g. random, weather, vegan, vegetarian, baking, daily, search).
      required: false
      default: random
      selector:
        select:
          options:
            - label: "Random Recipe"
              value: "random"
            - label: "Weather / Seasonal Recipe"
              value: "weather"
            - label: "Vegan Recipe"
              value: "vegan"
            - label: "Vegetarian Recipe"
              value: "vegetarian"
            - label: "Baking Recipe"
              value: "baking"
            - label: "Daily Recipe"
              value: "daily"
            - label: "Search Query"
              value: "search"
    query:
      name: Search Query
      description: Optional keyword for search type.
      required: false
      selector:
        text:
get_recommendations:
  name: Get Recipe Recommendations
  description: Fetches 3 distinct curated recipes (Weather #1, Vegan/Vegetarian #2, Weather #3) with all attributes returned directly in the response.
  fields:
    weather_entity:
      name: Weather Entity
      description: Optional weather entity to evaluate current conditions.
      required: false
      selector:
        entity:
          domain: weather
